PACKAGE_NAME="boxfs"
PACKAGE_VERSION="0.1.0"

BUILT_MODULE_NAME[0]="boxfs"
DEST_MODULE_LOCATION[0]="/kernel/fs/boxfs"

# The Rust core is a cargo staticlib with path dependencies on the surrounding
# box checkout, which DKMS does not copy into the build tree.
PRE_BUILD="dkms-prebuild.sh"

MAKE[0]="make -C ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build KDIR=/lib/modules/${kernelver}/build"
CLEAN="make -C ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build KDIR=/lib/modules/${kernelver}/build clean"

AUTOINSTALL="yes"
